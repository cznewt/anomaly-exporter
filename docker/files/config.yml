# Baked-in default config (overridden by mounting your own at
# /etc/anomaly-exporter/config.yml). See the repo-root config.yml for a fuller
# example and README.md for the matching Prometheus scrape_configs.

prometheus:
  url: http://prometheus-operated.monitoring.svc:9090
  timeout: 60s

modules:
  mem-prophet:
    detector: prophet
    lookback: 7d
    step: 5m
    eval_points: 12
    labels: [namespace, pod]
    timeout: 120s
    prophet:
      interval_width: 0.95
      daily_seasonality: true
      weekly_seasonality: auto

  cpu-iqr:
    detector: iqr
    lookback: 1d
    step: 1m
    eval_points: 10
    labels: [pod]
    iqr:
      k: 1.5

  latency-zscore:
    detector: zscore
    lookback: 1d
    step: 1m
    labels: [service]
    zscore:
      z_max: 4
