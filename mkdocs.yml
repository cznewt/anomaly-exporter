site_name: Anomaly Exporter for Prometheus
site_description: A multi-target Prometheus exporter that scores PromQL queries for anomalies.
repo_url: https://github.com/cznewt/anomaly-exporter
repo_name: cznewt/anomaly-exporter

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Usage:
    - Configuration: configuration.md
    - Detectors: detectors.md
    - Integrations: integrations.md
  - Operations:
    - Helm chart: helm.md
    - Observability: observ-lib.md
  - Reference:
    - Endpoints: endpoints.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
